# CONFIG STARTS
n_db_nodes: '1 1 1'
nr_dc: 3
n_loaders: 1
nemesis_add_node_cnt: 3
prepare_write_cmd: "cassandra-stress write no-warmup cl=ONE duration=1m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=1)' -mode cql3 native -rate 'threads=250 fixed=10/s' -col 'size=FIXED(128) n=FIXED(8)' -pop seq=1..162500000"
stress_cmd_w: "cassandra-stress write no-warmup cl=ONE duration=1m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=1)' -mode cql3 native -rate 'threads=250 fixed=10/s' -col 'size=FIXED(128) n=FIXED(8)' -pop 'dist=gauss(1..650000000,325000000,9750000)' "
stress_cmd_r: "cassandra-stress read no-warmup  cl=ONE duration=1m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=1)' -mode cql3 native -rate 'threads=250 fixed=10/s' -col 'size=FIXED(128) n=FIXED(8)' -pop 'dist=gauss(1..650000000,325000000,9750000)' "
stress_cmd_m: "cassandra-stress mixed no-warmup cl=ONE duration=1m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=1)' -mode cql3 native -rate 'threads=250 fixed=10/s' -col 'size=FIXED(128) n=FIXED(8)' -pop 'dist=gauss(1..650000000,325000000,6500000)' "
n_monitor_nodes: 1
use_mgmt: false
store_perf_results: true
email_recipients: ["asias@scylladb.com"]
use_prepared_loaders: false
use_hdr_cs_histogram: false
use_placement_group: false
use_capacity_reservation: false
email_subject_postfix: 'latency during operations'
append_scylla_args: '--enable-multiple-dc-opt 0 --hinted-handoff-enabled 0 --num-tokens 1 --blocked-reactor-notify-ms 5 --abort-on-lsa-bad-alloc 1 --abort-on-seastar-bad-alloc --abort-on-internal-error 1 --abort-on-ebadf 1'
# CONFIG ENDS
### WORK AWS MULTIPLE DC

# 600 minutes -> 10 hours
test_duration: 600
instance_type_loader: 'c5.xlarge'
instance_type_monitor: 't3.large'
instance_type_db: 'i3en.xlarge'

nemesis_class_name: GenerateDataRepairMonkey
#nemesis_class_name: InsertWithNodeDownRepairMonkey
#nemesis_class_name: NoCorruptRepairAllNodesMonkey
nemesis_interval: 0
nemesis_filter_seeds: false
nemesis_during_prepare: true

user_prefix: 'perf-latency-nemesis'

round_robin: true
backtrace_decoding: false
print_kernel_callstack: true
append_scylla_yaml:
    enable_tablets: false

